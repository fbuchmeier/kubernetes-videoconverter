replicaCount: 1

image:
  repository: ghcr.io/example/videoconverter
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

app:
  scanRoot: "/mnt/media"
  mountPath: "/mnt/media"
  pvcName: "media-pvc"
  desiredFormat: "mkv"
  jobNamespace: "default"
  jobPrefix: "video-convert"
  maxParallelJobs: 2
  maxRetries: 3
  pollInterval: 60
  dryRun: false
  jobTimeoutSeconds: 1800
  image: "ghcr.io/example/videoconverter-encoder:latest"
  jobScriptPath: "/usr/local/bin/encode_movie.sh"
  jobCpuRequest: "500m"
  jobMemoryRequest: "512Mi"
  jobCpuLimit: "2000m"
  jobMemoryLimit: "4Gi"
  jobStartDelaySeconds: 15
  networkThroughputMbps: 1000
  networkDelayFactor: 0.05

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

securityContext: {}
