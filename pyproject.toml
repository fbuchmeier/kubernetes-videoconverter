[project]
name = "videoconverter"
version = "0.1.0"
description = "Scan a media share for movies that need transcoding and submit Kubernetes Jobs to convert them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "kubernetes>=30.1.0",
  "PyYAML>=6.0.1",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_converter"]
