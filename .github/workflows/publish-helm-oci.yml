name: Publish Helm chart to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: |
          helm dependency build helm/videoconverter || true
          helm package helm/videoconverter --destination ./dist

      - name: Publish chart as OCI artifact
        run: |
          CHART_FILE=$(ls ./dist/videoconverter-*.tgz | head -n 1)
          helm push "$CHART_FILE" oci://ghcr.io/${{ github.repository_owner }}/helm-charts
